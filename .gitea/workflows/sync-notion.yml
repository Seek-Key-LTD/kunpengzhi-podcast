name: Sync to Notion

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/sync_notion.py'
  schedule:
    # 每天凌晨 04:00 (北京时间) 自动全量定时巡检同步一次
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  sync-notion:
    name: Auto Sync Episodes & Assets to Notion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Notion Sync Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: |
          python3 scripts/sync_notion.py

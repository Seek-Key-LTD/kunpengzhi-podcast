name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        run: |
          hugo --minify

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-r2:
    name: Sync Markdown Assets to Cloudflare R2
    runs-on: ubuntu-latest
    if: env.R2_ACCESS_KEY_ID != '' || env.CLOUDFLARE_API_TOKEN != ''
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'kunpengzhi-podcast' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync content/ (15 Canon + 6 Special Assets) to R2 via Wrangler / S3
        run: |
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_ACCOUNT_ID" ]; then
            echo "🚀 Syncing via S3-compatible API..."
            aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
            aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
            aws configure set default.region auto
            ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            aws s3 sync ./content "s3://${R2_BUCKET_NAME}/content" \
              --endpoint-url "$ENDPOINT_URL" \
              --content-type "text/markdown; charset=utf-8" \
              --delete
          elif [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Syncing via Cloudflare API Token & Wrangler..."
            npx wrangler r2 object put "${R2_BUCKET_NAME}" --file ./content --recursive 2>/dev/null || \
            node -e '
              const fs = require("fs");
              const path = require("path");
              const { execSync } = require("child_process");
              const bucket = process.env.R2_BUCKET_NAME || "kunpengzhi-podcast";
              function uploadDir(dir, prefix = "content") {
                const files = fs.readdirSync(dir);
                for (const f of files) {
                  const fp = path.join(dir, f);
                  const stat = fs.statSync(fp);
                  if (stat.isDirectory()) {
                    uploadDir(fp, `${prefix}/${f}`);
                  } else if (f.endsWith(".md")) {
                    const key = `${prefix}/${f}`;
                    console.log(`  Uploading ${key}...`);
                    try {
                      execSync(`npx wrangler r2 object put "${bucket}/${key}" --file "${fp}" --content-type "text/markdown; charset=utf-8"`, { stdio: "inherit" });
                    } catch (e) {
                      console.error(`  Failed to upload ${key}:`, e.message);
                    }
                  }
                }
              }
              uploadDir("./content");
            '
          fi
          echo "✔ R2 Sync process executed!"

name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        run: |
          hugo --minify

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-r2:
    name: Sync Markdown Assets to Cloudflare R2
    runs-on: ubuntu-latest
    if: env.R2_ACCOUNT_ID != '' && env.R2_ACCESS_KEY_ID != ''
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'kunpengzhi-podcast' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup AWS CLI for Cloudflare R2 (S3 Compatible)
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region auto

      - name: Sync content/ (15 Canon + 6 Special Assets) to R2
        run: |
          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "🚀 Syncing markdown canon & special assets to R2 bucket: ${R2_BUCKET_NAME}..."
          aws s3 sync ./content "s3://${R2_BUCKET_NAME}/content" \
            --endpoint-url "$ENDPOINT_URL" \
            --content-type "text/markdown; charset=utf-8" \
            --delete
          echo "✔ R2 Sync Completed successfully!"
